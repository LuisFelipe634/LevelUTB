services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-levelutb}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
    # POSTGRES_PASSWORD no se declara aca a proposito: llega por env_file (.env)
    # y por interpolacion, asi ninguna credencial queda literal en el repo.
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  external-academic-api:
    build: ./utb-external-api
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      PORT: "3001"
      API_KEY: "${UNIVERSITY_API_KEY:-dev-key}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').createConnection({port:3001,host:'127.0.0.1'},()=>process.exit(0)).on('error',()=>process.exit(1)).setTimeout(2000)\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      external-academic-api:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-levelutb}?schema=public"
      UNIVERSITY_API_URL: "http://external-academic-api:3001"
      UNIVERSITY_API_ENABLED: "true"
      NEXTAUTH_URL: "http://localhost:3000"
    command: sh -c "npm run db:push && npm run db:seed-if-empty && npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').createConnection({port:3000,host:'127.0.0.1'},()=>process.exit(0)).on('error',()=>process.exit(1)).setTimeout(2000)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata: {}
